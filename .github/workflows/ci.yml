name: Java CI Pipeline

on:
  push:
    branches: [CICD]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Maven execution permission
        run: chmod +x mvnw

      - name: Build and test application
        run: ./mvnw -B clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: CICD-JAR
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Docker Container
    needs: build
    runs-on: [ self-hosted, Windows, X64 ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Docker image using Jib
        run: .\mvnw.cmd clean compile jib:dockerBuild

      - name: Remove existing container
        shell: powershell
        run: |
          $container = docker ps -aq --filter "name=^/cicd-container$"
          if ($container) {
              docker rm -f cicd-container
          }

      - name: Create and start container
        run: docker run -d --name cicd-container -p 127.0.0.1:8080:8080 cicd-app:1.0

      - name: Verify running container
        run: docker ps